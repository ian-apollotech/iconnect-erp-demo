<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iConnect ERP — Merchandise & Supply Chain</title>
<style>
  :root{
    --navy:#0f2540; --navy2:#16324f; --navy3:#1d3f63;
    --blue:#2563eb; --blue-d:#1d4ed8; --blue-l:#eff4ff;
    --bg:#f1f5f9; --panel:#ffffff; --line:#e2e8f0; --line2:#cbd5e1;
    --txt:#1e293b; --muted:#64748b; --muted2:#94a3b8;
    --green:#059669; --green-l:#dcfce7; --amber:#d97706; --amber-l:#fef3c7;
    --red:#dc2626; --red-l:#fee2e2; --purple:#7c3aed; --purple-l:#ede9fe;
    --cyan:#0891b2; --cyan-l:#cffafe;
    --radius:6px; --sb:248px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:var(--sb) 1fr;grid-template-rows:52px 1fr;height:100vh}
  .topbar{grid-column:1 / 3;display:flex;align-items:center;gap:16px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 16px;z-index:30}
  .sidebar{grid-row:2;background:var(--navy);overflow-y:auto;color:#cbd5e1}
  .main{grid-row:2;overflow-y:auto;padding:20px 24px 60px}
  .brand{display:flex;align-items:center;gap:10px;min-width:var(--sb);margin-left:-16px;padding-left:16px;font-weight:700;font-size:15px;color:var(--navy)}
  .brand .logo{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#2563eb,#0891b2);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px}
  .brand small{display:block;font-weight:500;font-size:10px;color:var(--muted);letter-spacing:.3px}
  .ctx{display:flex;align-items:center;gap:8px}
  .ctx select{font-size:12px;padding:5px 26px 5px 9px;border:1px solid var(--line2);border-radius:var(--radius);background:var(--panel);color:var(--txt);cursor:pointer;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 8px center}
  .ctx label{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;margin-right:2px}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:14px}
  .icon-btn{position:relative;color:var(--muted);cursor:pointer;display:flex}
  .icon-btn .dot{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:9px;padding:0 4px;line-height:14px}
  .user{display:flex;align-items:center;gap:8px;cursor:pointer;padding-left:12px;border-left:1px solid var(--line)}
  .avatar{width:30px;height:30px;border-radius:50%;background:#334155;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
  .user .u-name{font-weight:600;font-size:12px}
  .user .u-role{font-size:10px;color:var(--muted)}
  .nav-group{padding:6px 0}
  .nav-group h4{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#64748b;padding:12px 18px 6px;font-weight:700}
  .nav-item{display:flex;align-items:center;gap:11px;padding:8px 18px;cursor:pointer;font-size:12.5px;color:#cbd5e1;border-left:3px solid transparent;user-select:none}
  .nav-item:hover{background:var(--navy2);color:#fff}
  .nav-item.active{background:var(--navy3);color:#fff;border-left-color:var(--blue);font-weight:600}
  .nav-item .ic{width:16px;height:16px;flex:none;opacity:.85}
  .nav-item .num{margin-left:auto;font-size:10px;color:#64748b;background:rgba(255,255,255,.06);border-radius:4px;padding:1px 6px}
  .nav-item.active .num{color:#bfdbfe;background:rgba(37,99,235,.25)}
  .crumb{font-size:11px;color:var(--muted);margin-bottom:4px}
  .crumb b{color:var(--txt)}
  .page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .page-head h1{font-size:20px;font-weight:700;color:var(--navy)}
  .page-head p{color:var(--muted);font-size:12.5px;margin-top:2px;max-width:640px}
  .page-head .ph-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:7px 13px;border-radius:var(--radius);border:1px solid var(--line2);background:var(--panel);color:var(--txt);cursor:pointer;white-space:nowrap}
  .btn:hover{background:#f8fafc}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.primary:hover{background:var(--blue-d)}
  .btn.sm{padding:4px 9px;font-size:11px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:18px}
  .panel-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .panel-head h3{font-size:13.5px;font-weight:700}
  .panel-head .sub{font-size:11px;color:var(--muted)}
  .panel-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .panel-body{padding:16px}
  .panel-body.flush{padding:0}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;border-left:3px solid var(--blue)}
  .stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .stat .val{font-size:24px;font-weight:800;color:var(--navy);margin-top:6px;letter-spacing:-.5px}
  .stat .delta{font-size:11px;margin-top:3px;font-weight:600}
  .stat .delta.up{color:var(--green)} .stat .delta.down{color:var(--red)}
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:12px 16px;border-bottom:1px solid var(--line);background:#fbfcfe}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .field input,.field select{padding:6px 9px;border:1px solid var(--line2);border-radius:var(--radius);font-size:12px;background:var(--panel);min-width:150px}
  .field.grow{flex:1}
  .filters .spacer{margin-left:auto}
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12px}
  thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
  tbody td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody tr:hover{background:#f8fbff}
  td .mono,.mono{font-family:"Consolas",monospace;font-size:11.5px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .t-title{font-weight:600;color:var(--navy)}
  .t-sub{font-size:11px;color:var(--muted)}
  .chk{width:14px;height:14px;cursor:pointer}
  .row-link{color:var(--blue);font-weight:600;cursor:pointer}
  .row-link:hover{text-decoration:underline}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px}
  .badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .b-green{background:var(--green-l);color:#047857}
  .b-amber{background:var(--amber-l);color:#b45309}
  .b-red{background:var(--red-l);color:#b91c1c}
  .b-blue{background:var(--blue-l);color:var(--blue-d)}
  .b-gray{background:#f1f5f9;color:#475569}
  .b-purple{background:var(--purple-l);color:#6d28d9}
  .b-cyan{background:var(--cyan-l);color:#0e7490}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tab{padding:9px 15px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab:hover{color:var(--txt)}
  .tab.active{color:var(--blue);border-bottom-color:var(--blue)}
  .tab .cnt{font-size:10px;background:#e2e8f0;color:#475569;border-radius:9px;padding:0 6px;margin-left:5px}
  .tab.active .cnt{background:var(--blue-l);color:var(--blue-d)}
  .tabpane{display:none} .tabpane.active{display:block}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 20px}
  .form-grid.two{grid-template-columns:1fr 1fr}
  .fg{display:flex;flex-direction:column;gap:5px}
  .fg.full{grid-column:1 / -1}
  .fg label{font-size:11px;font-weight:600;color:#475569}
  .fg label .req{color:var(--red)}
  .fg input,.fg select,.fg textarea{padding:7px 10px;border:1px solid var(--line2);border-radius:var(--radius);font-size:12.5px;background:var(--panel);font-family:inherit}
  .fg input:focus,.fg select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
  .fg input[readonly]{background:#f8fafc;color:var(--muted)}
  .section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:6px 0 2px;padding-top:12px;border-top:1px dashed var(--line);grid-column:1/-1}
  .section-label:first-child{border-top:none;padding-top:0}
  .split{display:grid;grid-template-columns:1fr 380px;gap:18px;align-items:start}
  @media(max-width:1200px){.split{grid-template-columns:1fr}}
  .tree{font-size:12.5px}
  .tree .node{padding:6px 10px;border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .tree .node:hover{background:#f1f5f9}
  .tree .node.active{background:var(--blue-l);color:var(--blue-d);font-weight:600}
  .tree .lvl1{padding-left:12px;font-weight:700}
  .tree .lvl2{padding-left:32px}
  .tree .lvl3{padding-left:52px}
  .tree .lvl4{padding-left:72px;color:var(--muted)}
  .tree .caret{width:12px;color:var(--muted2)}
  .tree .cnt{margin-left:auto;font-size:10px;color:var(--muted2)}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:12.5px}
  .kv .k{color:var(--muted)} .kv .v{font-weight:600}
  .steps{display:flex;align-items:center;gap:0;flex-wrap:wrap}
  .step{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .step .n{width:22px;height:22px;border-radius:50%;background:#e2e8f0;color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
  .step.done .n{background:var(--green);color:#fff}
  .step.active{color:var(--navy);font-weight:700}
  .step.active .n{background:var(--blue);color:#fff}
  .step .line{width:36px;height:2px;background:var(--line2);margin:0 6px}
  .empty{padding:40px;text-align:center;color:var(--muted2)}
  .progress{height:7px;background:#eef2f7;border-radius:6px;overflow:hidden}
  .progress > i{display:block;height:100%;border-radius:6px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
  .toolbar{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--blue-l);border-bottom:1px solid #dbeafe;font-size:12px;color:var(--blue-d);font-weight:600}
  .toolbar .btn{margin-left:auto}
  .note{background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:10px 12px;font-size:12px;color:#92400e;display:flex;gap:8px;align-items:flex-start}
  .note svg{flex:none;margin-top:1px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:1000px){.grid2{grid-template-columns:1fr}}
  .foot{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:#fbfcfe}
  .foot .right{margin-left:auto;display:flex;gap:8px}
  .mini-bar{display:flex;align-items:flex-end;gap:6px;height:120px}
  .mini-bar i{flex:1;background:var(--blue);border-radius:2px 2px 0 0;opacity:.85}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">iC</div>
      <div>iConnect ERP<small>Puregold · Merchandise &amp; Supply Chain</small></div>
    </div>
    <div class="ctx">
      <label>Company</label>
      <select><option>Puregold Price Club, Inc.</option><option>Ayagold Retailers Inc.</option><option>San Roque Supermarkets</option></select>
      <label>Zone</label>
      <select><option>All Zones</option><option>NCR</option><option>North Luzon</option><option>South Luzon</option><option>VisMin</option></select>
      <label>Branch</label>
      <select><option>All Branches</option><option>0102 · Ortigas Ext.</option><option>0107 · Araneta Cubao</option><option>0233 · Cebu (Mandaue)</option></select>
    </div>
    <div class="top-actions">
      <div class="icon-btn" title="Tasks"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span class="dot">7</span></div>
      <div class="icon-btn" title="Notifications"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="dot">3</span></div>
      <div class="user">
        <div class="avatar">RC</div>
        <div><div class="u-name">Rica Cruz</div><div class="u-role">Merchandise Admin</div></div>
      </div>
    </div>
  </header>
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>

<script>
const NAV = [
  {group:"Overview", items:[
    {id:"home", n:"", label:"Dashboard", icon:"grid"},
  ]},
  {group:"Master Data", items:[
    {id:"company",   n:"1", label:"Company Maintenance", icon:"building"},
    {id:"branch",    n:"2", label:"Store Branch Maintenance", icon:"store"},
    {id:"vendor",    n:"3", label:"Vendor Maintenance", icon:"truck"},
    {id:"allowance", n:"4", label:"Vendor Allowance", icon:"percent"},
    {id:"hierarchy", n:"5", label:"Item Hierarchy", icon:"tree"},
    {id:"item",      n:"6", label:"Item Maintenance", icon:"box"},
  ]},
  {group:"Inventory & Pricing", items:[
    {id:"inventory", n:"7", label:"Product Inventory", icon:"layers"},
    {id:"price",     n:"8", label:"Price Change Mgmt", icon:"tag"},
    {id:"cost",      n:"9", label:"Cost Change Mgmt", icon:"coins"},
  ]},
  {group:"Procurement", items:[
    {id:"po",        n:"10", label:"Purchase Order", icon:"cart"},
    {id:"replen",    n:"11", label:"Auto Replenishment", icon:"refresh"},
    {id:"receiving", n:"12", label:"PO Receiving", icon:"inbox"},
  ]},
  {group:"Store Operations", items:[
    {id:"transfer",  n:"13", label:"Store-to-Store Transfer", icon:"swap"},
    {id:"rtv",       n:"14", label:"Return To Vendor", icon:"undo"},
    {id:"adjust",    n:"15", label:"Inventory Adjustment", icon:"sliders"},
    {id:"makeup",    n:"16", label:"Make-up / Break-up", icon:"scissors"},
  ]},
  {group:"Financial", items:[
    {id:"salesaudit",n:"17", label:"Sales Audit", icon:"receipt"},
  ]},
];
const ICONS = {
  grid:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>',
  building:'<path d="M3 21h18M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M9 8h1M9 12h1M14 8h1M14 12h1"/>',
  store:'<path d="M3 9l1-5h16l1 5M4 9v11h16V9M4 9h16M9 20v-6h6v6"/>',
  truck:'<path d="M1 3h15v13H1zM16 8h4l3 3v5h-7M5.5 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM18.5 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>',
  percent:'<path d="M19 5L5 19M6.5 9a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM17.5 20a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>',
  tree:'<path d="M3 3h6v6H3zM15 15h6v6h-6zM15 3h6v6h-6zM6 9v6h9M18 9v6"/>',
  box:'<path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/>',
  layers:'<path d="M12 2l9 5-9 5-9-5 9-5zM3 12l9 5 9-5M3 17l9 5 9-5"/>',
  tag:'<path d="M20 12l-8 8-9-9V3h8l9 9zM7 7h.01"/>',
  coins:'<path d="M9 8a6 3 0 1 0 0-6 6 3 0 0 0 0 6zM3 5v6c0 1.7 2.7 3 6 3s6-1.3 6-3M3 11v6c0 1.7 2.7 3 6 3s6-1.3 6-3"/>',
  cart:'<path d="M9 22a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM20 22a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',
  refresh:'<path d="M23 4v6h-6M1 20v-6h6M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/>',
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2M5.5 5h13l3.5 7v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',
  swap:'<path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/>',
  undo:'<path d="M3 7v6h6M3 13a9 9 0 1 0 3-7.7L3 8"/>',
  sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  scissors:'<path d="M6 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM20 4L8.1 15.9M14.5 12.5L20 20M8.1 8.1L12 12"/>',
  receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1zM8 7h8M8 11h8M8 15h5"/>',
};
function renderSidebar(active){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = NAV.map(g=>`
    <div class="nav-group"><h4>${g.group}</h4>
      ${g.items.map(it=>`
        <div class="nav-item ${it.id===active?'active':''}" data-id="${it.id}">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[it.icon]||''}</svg>
          <span>${it.label}</span>${it.n?`<span class="num">${it.n}</span>`:''}
        </div>`).join('')}
    </div>`).join('');
  sb.querySelectorAll('.nav-item').forEach(el=>el.onclick=()=>route(el.dataset.id));
}
function head(no,title,desc,actions){
  return `<div class="crumb">iConnect ERP <b>›</b> ${no?`Module ${no} <b>›</b> `:''}<b>${title}</b></div>
  <div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div><div class="ph-actions">${actions||''}</div></div>`;
}
function badge(type,text){return `<span class="badge b-${type}">${text}</span>`;}
function stat(lbl,val,extra){return `<div class="stat"><div class="lbl">${lbl}</div><div class="val">${val}</div>${extra||''}</div>`;}
function ph(title,sub,right){return `<div class="panel-head"><h3>${title}</h3>${sub?`<span class="sub">${sub}</span>`:''}${right?`<div class="right">${right}</div>`:''}</div>`;}
function btn(label,cls,icon){return `<button class="btn ${cls||''}">${icon?icon+' ':''}${label}</button>`;}
const iAdd='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const iExport='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>';
const iFilter='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3H2l8 9.5V19l4 2v-8.5z"/></svg>';
function table(cols, rows){
  return `<div class="tbl-wrap"><table><thead><tr>${cols.map(c=>`<th class="${c.num?'num':''}">${c.t}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c.num?'num':''}">${r[c.k]??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function filterbar(fields, actions){
  return `<div class="filters">${fields.map(f=>`<div class="field ${f.grow?'grow':''}"><label>${f.label}</label>${f.html||`<input placeholder="${f.ph||''}">`}</div>`).join('')}
    <div class="spacer"></div>${actions||btn('Filter','')}</div>`;
}
function tabs(id, items){
  return `<div class="tabs" data-tabs="${id}">${items.map((t,i)=>`<div class="tab ${i===0?'active':''}" data-tab="${id}-${i}">${t.label}${t.cnt!=null?`<span class="cnt">${t.cnt}</span>`:''}</div>`).join('')}</div>
    ${items.map((t,i)=>`<div class="tabpane ${i===0?'active':''}" id="${id}-${i}">${t.body}</div>`).join('')}`;
}
function pager(showing,total){
  return `<div class="foot"><span class="t-sub">Showing <b>${showing}</b> of <b>${total}</b> records</span>
    <div class="right"><button class="btn sm">‹ Prev</button><button class="btn sm">1</button><button class="btn sm primary">2</button><button class="btn sm">3</button><button class="btn sm">Next ›</button></div></div>`;
}
function noteBox(html,color){
  const s = color==='cyan'?'background:#ecfeff;border-color:#a5f3fc;color:#0e7490'
    :color==='indigo'?'background:#eef2ff;border-color:#c7d2fe;color:#4338ca'
    :color==='green'?'background:#f0fdf4;border-color:#bbf7d0;color:#15803d':'';
  return `<div class="note" style="${s}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><div>${html}</div></div>`;
}

function route(id){
  const page = PAGES[id] || (()=>`<div class="empty">Module not found.</div>`);
  document.getElementById('main').innerHTML = page();
  document.getElementById('main').scrollTop = 0;
  renderSidebar(id);
  bindTabs();
}
function bindTabs(){
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick=()=>{
      const target = t.dataset.tab;
      const group = t.parentElement;
      group.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      const prefix = target.split('-').slice(0,-1).join('-');
      document.querySelectorAll('.tabpane').forEach(p=>{
        if(p.id.startsWith(prefix+'-')) p.classList.toggle('active', p.id===target);
      });
    };
  });
}
route('home');
