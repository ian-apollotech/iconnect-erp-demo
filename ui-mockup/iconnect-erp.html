<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iConnect ERP — Merchandise & Supply Chain</title>
<style>
  :root{
    --navy:#0f2540; --navy2:#16324f; --navy3:#1d3f63;
    --blue:#2563eb; --blue-d:#1d4ed8; --blue-l:#eff4ff;
    --bg:#f1f5f9; --panel:#ffffff; --line:#e2e8f0; --line2:#cbd5e1;
    --txt:#1e293b; --muted:#64748b; --muted2:#94a3b8;
    --green:#059669; --green-l:#dcfce7; --amber:#d97706; --amber-l:#fef3c7;
    --red:#dc2626; --red-l:#fee2e2; --purple:#7c3aed; --purple-l:#ede9fe;
    --cyan:#0891b2; --cyan-l:#cffafe;
    --radius:6px; --sb:248px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:var(--sb) 1fr;grid-template-rows:52px 1fr;height:100vh}
  .topbar{grid-column:1 / 3;display:flex;align-items:center;gap:16px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 16px;z-index:30}
  .sidebar{grid-row:2;background:var(--navy);overflow-y:auto;color:#cbd5e1}
  .main{grid-row:2;overflow-y:auto;padding:20px 24px 60px}
  .brand{display:flex;align-items:center;gap:10px;min-width:var(--sb);margin-left:-16px;padding-left:16px;font-weight:700;font-size:15px;color:var(--navy)}
  .brand .logo{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#2563eb,#0891b2);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px}
  .brand small{display:block;font-weight:500;font-size:10px;color:var(--muted);letter-spacing:.3px}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:14px}
  .icon-btn{position:relative;color:var(--muted);cursor:pointer;display:flex}
  .icon-btn .dot{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:9px;padding:0 4px;line-height:14px}
  .user{display:flex;align-items:center;gap:8px;cursor:pointer;padding-left:12px;border-left:1px solid var(--line)}
  .avatar{width:30px;height:30px;border-radius:50%;background:#334155;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
  .user .u-name{font-weight:600;font-size:12px}
  .user .u-role{font-size:10px;color:var(--muted)}
  .nav-group{padding:6px 0}
  .nav-group h4{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#64748b;padding:12px 18px 6px;font-weight:700}
  .nav-item{display:flex;align-items:center;gap:11px;padding:8px 18px;cursor:pointer;font-size:12.5px;color:#cbd5e1;border-left:3px solid transparent;user-select:none}
  .nav-item:hover{background:var(--navy2);color:#fff}
  .nav-item.active{background:var(--navy3);color:#fff;border-left-color:var(--blue);font-weight:600}
  .nav-item .ic{width:16px;height:16px;flex:none;opacity:.85}
  .nav-item .num{margin-left:auto;font-size:10px;color:#64748b;background:rgba(255,255,255,.06);border-radius:4px;padding:1px 6px}
  .nav-item.active .num{color:#bfdbfe;background:rgba(37,99,235,.25)}
  .nav-sub{margin:2px 0}
  .nav-sub h5{font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:#5b6a82;padding:8px 18px 4px 30px;font-weight:700;margin:0}
  .nav-sub .nav-item{padding-left:32px;font-size:12px}
  .nav-sub .nav-item .ic{width:14px;height:14px}
  .crumb{font-size:11px;color:var(--muted);margin-bottom:4px}
  .crumb b{color:var(--txt)}
  .page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .page-head h1{font-size:20px;font-weight:700;color:var(--navy)}
  .page-head p{color:var(--muted);font-size:12.5px;margin-top:2px;max-width:640px}
  .page-head .ph-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:7px 13px;border-radius:var(--radius);border:1px solid var(--line2);background:var(--panel);color:var(--txt);cursor:pointer;white-space:nowrap}
  .btn:hover{background:#f8fafc}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.primary:hover{background:var(--blue-d)}
  .btn.sm{padding:4px 9px;font-size:11px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:18px}
  .panel-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .panel-head h3{font-size:13.5px;font-weight:700}
  .panel-head .sub{font-size:11px;color:var(--muted)}
  .panel-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .panel-body{padding:16px}
  .panel-body.flush{padding:0}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;border-left:3px solid var(--blue)}
  .stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .stat .val{font-size:24px;font-weight:800;color:var(--navy);margin-top:6px;letter-spacing:-.5px}
  .stat .delta{font-size:11px;margin-top:3px;font-weight:600}
  .stat .delta.up{color:var(--green)} .stat .delta.down{color:var(--red)}
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:12px 16px;border-bottom:1px solid var(--line);background:#fbfcfe}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .field input,.field select{padding:6px 9px;border:1px solid var(--line2);border-radius:var(--radius);font-size:12px;background:var(--panel);min-width:150px}
  .field.grow{flex:1}
  .filters .spacer{margin-left:auto}
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12px}
  thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
  tbody td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody tr:hover{background:#f8fbff}
  td .mono,.mono{font-family:"Consolas",monospace;font-size:11.5px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .t-title{font-weight:600;color:var(--navy)}
  .t-sub{font-size:11px;color:var(--muted)}
  .chk{width:14px;height:14px;cursor:pointer}
  .row-link{color:var(--blue);font-weight:600;cursor:pointer}
  .row-link:hover{text-decoration:underline}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px}
  .badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .b-green{background:var(--green-l);color:#047857}
  .b-amber{background:var(--amber-l);color:#b45309}
  .b-red{background:var(--red-l);color:#b91c1c}
  .b-blue{background:var(--blue-l);color:var(--blue-d)}
  .b-gray{background:#f1f5f9;color:#475569}
  .b-purple{background:var(--purple-l);color:#6d28d9}
  .b-cyan{background:var(--cyan-l);color:#0e7490}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tab{padding:9px 15px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab:hover{color:var(--txt)}
  .tab.active{color:var(--blue);border-bottom-color:var(--blue)}
  .tab .cnt{font-size:10px;background:#e2e8f0;color:#475569;border-radius:9px;padding:0 6px;margin-left:5px}
  .tab.active .cnt{background:var(--blue-l);color:var(--blue-d)}
  .tabpane{display:none} .tabpane.active{display:block}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 20px}
  .form-grid.two{grid-template-columns:1fr 1fr}
  .fg{display:flex;flex-direction:column;gap:5px}
  .fg.full{grid-column:1 / -1}
  .fg label{font-size:11px;font-weight:600;color:#475569}
  .fg label .req{color:var(--red)}
  .fg input,.fg select,.fg textarea{padding:7px 10px;border:1px solid var(--line2);border-radius:var(--radius);font-size:12.5px;background:var(--panel);font-family:inherit}
  .fg input:focus,.fg select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
  .fg input[readonly]{background:#f8fafc;color:var(--muted)}
  .section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:6px 0 2px;padding-top:12px;border-top:1px dashed var(--line);grid-column:1/-1}
  .section-label:first-child{border-top:none;padding-top:0}
  .split{display:grid;grid-template-columns:1fr 380px;gap:18px;align-items:start}
  @media(max-width:1200px){.split{grid-template-columns:1fr}}
  .tree{font-size:12.5px}
  .tree .node{padding:6px 10px;border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .tree .node:hover{background:#f1f5f9}
  .tree .node.active{background:var(--blue-l);color:var(--blue-d);font-weight:600}
  .tree .lvl1{padding-left:12px;font-weight:700}
  .tree .lvl2{padding-left:32px}
  .tree .lvl3{padding-left:52px}
  .tree .lvl4{padding-left:72px;color:var(--muted)}
  .tree .caret{width:12px;color:var(--muted2)}
  .tree .cnt{margin-left:auto;font-size:10px;color:var(--muted2)}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:12.5px}
  .kv .k{color:var(--muted)} .kv .v{font-weight:600}
  .steps{display:flex;align-items:center;gap:0;flex-wrap:wrap}
  .step{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .step .n{width:22px;height:22px;border-radius:50%;background:#e2e8f0;color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
  .step.done .n{background:var(--green);color:#fff}
  .step.active{color:var(--navy);font-weight:700}
  .step.active .n{background:var(--blue);color:#fff}
  .step .line{width:36px;height:2px;background:var(--line2);margin:0 6px}
  .empty{padding:40px;text-align:center;color:var(--muted2)}
  .progress{height:7px;background:#eef2f7;border-radius:6px;overflow:hidden}
  .progress > i{display:block;height:100%;border-radius:6px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
  .toolbar{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--blue-l);border-bottom:1px solid #dbeafe;font-size:12px;color:var(--blue-d);font-weight:600}
  .toolbar .btn{margin-left:auto}
  .note{background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:10px 12px;font-size:12px;color:#92400e;display:flex;gap:8px;align-items:flex-start}
  .note svg{flex:none;margin-top:1px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:1000px){.grid2{grid-template-columns:1fr}}
  .foot{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:#fbfcfe}
  .foot .right{margin-left:auto;display:flex;gap:8px}
  .rbac{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
  @media(max-width:1000px){.rbac{grid-template-columns:1fr}}
  .rolelist .role{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:6px;cursor:pointer;font-size:12.5px;border:1px solid transparent}
  .rolelist .role:hover{background:#f1f5f9}
  .rolelist .role.active{background:var(--blue-l);border-color:#bfdbfe;color:var(--blue-d);font-weight:600}
  .rolelist .role .cnt{margin-left:auto;font-size:10px;color:var(--muted2);background:rgba(100,116,139,.12);border-radius:10px;padding:1px 7px}
  .rl-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .rl-actions{margin-left:auto;display:flex;gap:6px}
  .rtag{font-size:9px;font-weight:700;color:#94a3b8;border:1px solid var(--line2);border-radius:4px;padding:1px 5px;text-transform:uppercase;letter-spacing:.3px}
  .perm td:not(:first-child),.perm th:not(:first-child){text-align:center;width:74px}
  .perm td:first-child{font-weight:600;color:var(--navy)}
  .perm input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--blue)}
  .scope{display:flex;flex-direction:column;gap:12px;font-size:12.5px}
  .scope .opt{display:flex;align-items:center;gap:9px;font-weight:600;color:var(--txt)}
  .scope .opt input{width:15px;height:15px;accent-color:var(--blue);cursor:pointer}
  .storepick{display:flex;flex-direction:column;gap:2px;max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:6px}
  .storepick label{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:5px;font-size:12.5px;cursor:pointer}
  .storepick label:hover{background:#f1f5f9}
  .storepick input{accent-color:var(--blue);cursor:pointer}
  .spk{grid-column:1/-1}
  .spk-cols{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
  .spk-panel{border:1px solid var(--line2);border-radius:var(--radius);background:var(--panel);display:flex;flex-direction:column;min-height:200px}
  .spk-head{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .spk-badge{background:var(--navy);color:#fff;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700;letter-spacing:0}
  .spk-search{margin:8px 8px 4px;padding:6px 9px;border:1px solid var(--line2);border-radius:var(--radius);font-size:12px;font-family:inherit}
  .spk-search:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
  .spk-list{flex:1;overflow-y:auto;padding:4px}
  .spk-item{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:5px;font-size:12.5px;cursor:pointer;user-select:none}
  .spk-item:hover{background:var(--bg)}
  .spk-item.sel{background:var(--blue-l);color:var(--navy);font-weight:600}
  .spk-item .spk-code{font-family:ui-monospace,SFMono-Regular,monospace;color:var(--muted);font-size:11px;min-width:48px}
  .spk-item.sel .spk-code{color:var(--navy)}
  .spk-mid{display:flex;flex-direction:column;justify-content:center;gap:8px}
  .spk-mid .btn{min-width:36px;justify-content:center;font-size:16px;line-height:1;padding:6px 9px}
  .spk-empty{padding:16px 10px;font-size:12px;color:var(--muted);text-align:center;font-style:italic}
  /* Price Event wizard */
  .pw-browse-controls{display:flex;gap:16px;align-items:flex-end;margin-bottom:12px;flex-wrap:wrap}
  .pw-browse-controls .fg{min-width:200px}
  .pw-review{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px 20px;padding:4px 0}
  .pw-review .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:3px}
  .pw-review .v{font-weight:600;color:var(--navy)}
  .step[data-pwstep]{cursor:pointer}
  .step[data-cwstep]{cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">iC</div>
      <div>iConnect ERP<small>Puregold · Merchandise &amp; Supply Chain</small></div>
    </div>
    <div class="top-actions">
      <div class="icon-btn" title="Tasks"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span class="dot">7</span></div>
      <div class="icon-btn" title="Notifications"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="dot">3</span></div>
      <div class="user">
        <div class="avatar">RC</div>
        <div><div class="u-name">Rica Cruz</div><div class="u-role">Merchandise Admin</div></div>
      </div>
    </div>
  </header>
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>

<script>
const NAV = [
  {group:"Overview", items:[
    {id:"home", n:"", label:"Dashboard", icon:"grid"},
  ]},
  {group:"Master Data", items:[
    {subhead:"Organization", items:[
      {id:"company",   n:"1", label:"Company Maintenance", icon:"building"},
      {id:"branch",    n:"2", label:"Branch", icon:"store"},
    ]},
    {subhead:"Store Grouping", items:[
      {id:"pricezone",    n:"", label:"Price Zone",            icon:"tag"},
      {id:"costzone",     n:"", label:"Cost Zone",             icon:"coins"},
      {id:"cluster",      n:"", label:"Assortment Cluster",    icon:"layers"},
      {id:"replenpolicy", n:"", label:"Replenishment Profile", icon:"refresh"},
    ]},
    {subhead:"Vendor", items:[
      {id:"vendor",     n:"3", label:"Vendor", icon:"truck"},
      {id:"vencat",     n:"",  label:"Vendor Category Hierarchy", icon:"tree"},
      {id:"vencatalog", n:"",  label:"Vendor Product", icon:"book"},
      {id:"allowance",  n:"4", label:"Vendor Allowance", icon:"percent"},
    ]},
    {subhead:"Product", items:[
      {id:"hierarchy", n:"5", label:"Category Hierarchy", icon:"tree"},
      {id:"item",      n:"6", label:"Product", icon:"box"},
      {id:"brand",     n:"",  label:"Product Brand", icon:"tag"},
      {id:"attribute", n:"",  label:"Product Attribute", icon:"sliders"},
    ]},
  ]},
  {group:"Merchandising", items:[
    {id:"price",     n:"8", label:"Price Change Mgmt", icon:"tag"},
    {id:"cost",      n:"9", label:"Cost Change Mgmt", icon:"coins"},
  ]},
  {group:"Planning & Replenishment", items:[
    {id:"assortplan",    n:"", label:"Assortment Plan", icon:"book"},
    {id:"demand",        n:"11", label:"Demand Signal", icon:"activity"},
    {id:"rpolicy",       n:"", label:"Replenishment Policy", icon:"sliders"},
    {id:"ordercalendar", n:"", label:"Order Calendar", icon:"book"},
    {id:"vendorschedule",n:"", label:"Vendor Schedule", icon:"refresh"},
    {id:"replen",        n:"11", label:"Auto Replenishment", icon:"refresh"},
  ]},
  {group:"Procurement", items:[
    {id:"po",        n:"10", label:"Purchase Order", icon:"cart"},
    {id:"receiving", n:"12", label:"PO Receiving", icon:"inbox"},
  ]},
  {group:"Inventory", items:[
    {id:"inventory", n:"7", label:"Product Inventory", icon:"layers"},
    {id:"adjust",    n:"15", label:"Inventory Adjustment", icon:"sliders"},
    {id:"transfer",  n:"13", label:"Store-to-Store Transfer", icon:"swap"},
    {id:"rtv",       n:"14", label:"Return To Vendor", icon:"undo"},
    {id:"makeup",    n:"16", label:"Make-up / Break-up", icon:"scissors"},
  ]},
  {group:"Sales", items:[
    {id:"salesaudit",n:"17", label:"POS Sales", icon:"receipt"},
  ]},
  {group:"Administration", items:[
    {id:"users",       n:"", label:"Users", icon:"users"},
    {id:"roles",       n:"", label:"Roles", icon:"shield"},
    {id:"branchaccess",n:"", label:"Branch Access", icon:"mappin"},
    {id:"audit",       n:"", label:"Audit Log", icon:"activity"},
  ]},
];
const ICONS = {
  grid:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>',
  building:'<path d="M3 21h18M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M9 8h1M9 12h1M14 8h1M14 12h1"/>',
  store:'<path d="M3 9l1-5h16l1 5M4 9v11h16V9M4 9h16M9 20v-6h6v6"/>',
  truck:'<path d="M1 3h15v13H1zM16 8h4l3 3v5h-7M5.5 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM18.5 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>',

function viewShell(rec, def){

// ---- Product attributes: dynamic list of {n:attribute, v:value}. Every attribute is a value list,
// so a product's value is ALWAYS chosen from the attribute's Allowed Values. ----
let ATTR_DRAFT = [];                       // working list while adding/editing on New/Edit
function cloneAttrs(a){ return (a||[]).map(x=>({n:x.n, v:x.v})); }
function byAttrName(n){ return (MD.attribute||[]).find(a=>a.name===n) || {}; }
function attrVals(a){ return (a&&a.values&&a.values!=='—') ? a.values.split(',').map(s=>s.trim()) : []; }
function firstAllowed(a){ return attrVals(a)[0]||''; }
// Read-only (editable=false) or editable (New/Edit) render of a product's attribute list.
function attrTab(list, editable){
  if(!MD.attribute) PAGES.attribute();
  const master = MD.attribute||[];
  list = list||[];
  const add = `<button class="btn sm primary" data-attradd="1">+ Add Attribute</button>`;
  const hdr = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><span class="section-label" style="border-top:none;padding-top:0;margin:0">Attributes${list.length?` <span class="badge b-blue">${list.length}</span>`:''}</span>${editable?add:''}</div>`;
  if(!list.length){
    const msg = editable
      ? 'No attributes yet. Click <b>+ Add Attribute</b> to attach one from the Product Attribute master and pick a value.'
      : 'No attributes on this product. Attributes are optional and managed in Edit.';
    return `${hdr}<div class="t-sub" style="padding:10px 2px">${msg}</div>`;
  }
  const rows = list.map((x,i)=>{
    const a = byAttrName(x.n), vals = attrVals(a);
    let atCell, valCell;
    if(editable){
      atCell = `<select data-attrname="1" data-i="${i}">${master.map(m=>`<option${m.name===x.n?' selected':''}>${m.name}</option>`).join('')}</select>`;
      valCell = `<select data-attrval="1" data-i="${i}">${vals.length?vals.map(v=>`<option${v===x.v?' selected':''}>${v}</option>`).join(''):`<option>${attr(x.v)}</option>`}</select>`;
    } else {
      atCell = a.code?rowlink('attribute',a.code,x.n):x.n;
      valCell = `<b>${x.v}</b>`;
    }
    const r = { at:atCell, vl:valCell, al:`<span class="t-sub">${vals.join(', ')||'—'}</span>` };
    if(editable) r.act = `<button class="btn ghost sm" data-attrdel="1" data-i="${i}">Remove</button>`;
    return r;
  });
  const cols = editable
    ? [{t:'Attribute',k:'at'},{t:'Value',k:'vl'},{t:'Allowed Values',k:'al'},{t:'',k:'act'}]
    : [{t:'Attribute',k:'at'},{t:'Value',k:'vl'},{t:'Allowed Values',k:'al'}];
  return `${hdr}${table(cols, rows)}`;
}
function attrHostHtml(list){ return `<div class="panel-body"><div id="attrHost">${attrTab(list, true)}</div></div>`; }
function refreshAttrs(){ const h=document.getElementById('attrHost'); if(!h) return; h.innerHTML=attrTab(ATTR_DRAFT, true); bindAttrEditor(); }
function bindAttrEditor(){
  const host=document.getElementById('attrHost'); if(!host) return;
  host.querySelectorAll('[data-attradd]').forEach(b=>b.onclick=()=>{ const f=(MD.attribute||[])[0]||{}; ATTR_DRAFT.push({n:f.name||'', v:firstAllowed(f)}); refreshAttrs(); });
  host.querySelectorAll('[data-attrdel]').forEach(b=>b.onclick=()=>{ ATTR_DRAFT.splice(+b.getAttribute('data-i'),1); refreshAttrs(); });
  host.querySelectorAll('[data-attrname]').forEach(s=>s.onchange=()=>{ const i=+s.getAttribute('data-i'); ATTR_DRAFT[i].n=s.value; ATTR_DRAFT[i].v=firstAllowed(byAttrName(s.value)); refreshAttrs(); });
  host.querySelectorAll('[data-attrval]').forEach(s=>s.onchange=()=>{ ATTR_DRAFT[+s.getAttribute('data-i')].v=s.value; });
}
function vFields(fields, editing){
  if(!editing){
    const cells = fields.filter(f=>!f.section).map(f=>{
      const val = f.disp!=null ? f.disp : (f.v==null||f.v===''?'—':f.v);
      return `<div class="k">${f.l}</div><div class="v">${val}</div>`;
    }).join('');
    return `<div class="kv" style="grid-template-columns:170px 1fr 170px 1fr">${cells}</div>`;
  }
  return `<div class="form-grid">${fields.map(f=>{
    if(f.section) return `<div class="section-label">${f.section}</div>`;
    const full=f.full?' full':'';
    let ctrl;
    if(f.type==='select'){
      const opts=(f.opts&&f.opts.length)?f.opts:[f.v];
      ctrl=`<select${f.ro?' disabled':''}>${opts.map(o=>`<option${o===f.v?' selected':''}>${o}</option>`).join('')}</select>`;
    } else {
      ctrl=`<input value="${attr(f.v)}"${f.ro?' readonly':''}${f.mono?' class="mono"':''}>`;
    }
    return `<div class="fg${full}"><label>${f.l}</label>${ctrl}</div>`;
  }).join('')}</div>`;
}
function bindViewPage(){

  m.querySelectorAll('[data-viewsave]').forEach(b=>b.onclick=()=>{VIEW.editing=false;VIEW.flash=true;rerenderView();});
  m.querySelectorAll('.store-search').forEach(inp=>inp.oninput=()=>{

}

function editForm(entity, rec, def){
  const cfg = CREATE[EDIT_KEY[entity]];
  if(!cfg) return '<div class="panel"><div class="panel-body">No edit form defined for this entity.</div></div>';
  const vals = (EDIT_FILL[entity]||(()=>({})))(rec) || {};
  const sectionsHtml = cfg.sections.map(s=>`<div class="section-label">${s.l}</div>`+
    s.f.map(f=>{ const v=vals[f.l]; return ff(v!=null?Object.assign({},f,{v:v}):f); }).join('')
  ).join('');
  const ref = `${rec[def.keyField]||''} · Editing`;
  const detailsBody = `<div class="panel-body"><div class="form-grid">${sectionsHtml}</div></div>`;
  if(entity==='item') ATTR_DRAFT = cloneAttrs(rec.attrs);
  // Product Edit is tabbed (Details + Attributes) — same shape as New and View for a consistent feel.
  const body = entity==='item'
    ? tabs('itemedit',[{label:'Details',body:detailsBody},{label:'Attributes',cnt:ATTR_DRAFT.length,body:attrHostHtml(ATTR_DRAFT)}])
    : detailsBody;
  const headTitle = entity==='item' ? 'Product' : (cfg.formTitle||'Details');
  const grid = `<div class="panel"><div class="panel-head"><h3>${headTitle}</h3><span class="sub">${ref}</span></div>${body}</div>`;
  const foot = `<div class="panel"><div class="foot"><span class="t-sub"></span><div class="right"><button class="btn" data-viewcancel="1">Cancel</button><button class="btn primary" data-viewsave="1">${cfg.cta||'Save'}</button></div></div></div>`;
  return grid + foot;
}

// Which BRANCH_GROUPING key a store-group entity is drawn on (pz/cz/cl/rp)
const GROUP_MEMBER_KEY = {pricezone:'pz', costzone:'cz', cluster:'cl', replenpolicy:'rp'};
// The member stores of a store group, drawn from the branch master. A mockup derivation: a store
// belongs if its Format-derived grouping matches the group name, or its Region does (region-named
// zones). Falls back to the group's company stores as a representative sample when nothing maps.
function groupMembers(entity, rec){
  const key = GROUP_MEMBER_KEY[entity]; if(!key) return [];
  if(!MD.branch) PAGES.branch();
  const all = MD.branch||[], co = rec.companyCode;
  let mem = all.filter(b=>{
    if(co && b.companyCode!==co) return false;
    const g = BRANCH_GROUPING[b.format]||{};
    return g[key]===rec.name || b.region===rec.name || (rec.name&&rec.name.indexOf(b.region)>=0);
  });
  if(!mem.length) mem = all.filter(b=>!co || b.companyCode===co);
  return mem;
}
// Read-only searchable list of a store group's member stores (replaces the bare count).
function storeListView(entity, rec, label){
  const mem = groupMembers(entity, rec);
  const total = rec.stores!=null && rec.stores!=='' ? parseInt(String(rec.stores).replace(/[^0-9]/g,''),10) : mem.length;
  const sample = mem.length < total;
  const uid = 'ss-'+entity+'-'+String(rec.code||rec.id||'x').replace(/[^A-Za-z0-9]/g,'');
  const rows = mem.map(b=>
    `<label data-store="${attr((b.code+' '+b.name).toLowerCase())}"><span class="mono" style="min-width:62px">${b.code}</span>`+
    `<span style="flex:1">${b.name}</span>${badge(FMT_COLOR[b.format]||'gray', b.format)}</label>`
  ).join('') || '<div class="t-sub" style="padding:8px">No stores assigned.</div>';
  return `<div style="grid-column:1/-1">
    <div style="display:flex;align-items:center;gap:8px;margin:2px 0 6px">
      <span class="section-label" style="border-top:none;padding-top:0;margin:0">${label}</span>
      ${badge('blue', mem.length+' shown'+(sample?' · '+total+' assigned':''))}
      ${sample?'<span class="t-sub">representative sample</span>':''}
    </div>
    <input class="store-search" data-target="${uid}" placeholder="Quick search stores by code or name…" style="width:100%;margin-bottom:6px">
    <div class="storepick" id="${uid}">${rows}</div>
  </div>`;
}
// Read-only render of the SAME fields the New form asks for (one section per New-form section)
function roFields(entity, rec){
  const cfg = CREATE[EDIT_KEY[entity]]; if(!cfg) return '';
  const vals = (EDIT_FILL[entity]||(()=>({})))(rec) || {};
  return cfg.sections.map(s=>{
    const kvFields = s.f.filter(f=>f.type!=='storepicker');
    const pickers  = s.f.filter(f=>f.type==='storepicker');
    const rows = kvFields.map(f=>{
      let v = vals[f.l];
      return `<div class="k">${f.l}</div><div class="v">${v==null||v===''?'—':v}</div>`;
    }).join('');
    const kvHtml = rows ? `<div class="kv" style="grid-template-columns:180px 1fr 180px 1fr">${rows}</div>` : '';
    const pickHtml = pickers.map(f=>storeListView(entity, rec, f.l)).join('');
    return `<div class="panel-body"><div class="section-label" style="border-top:none;padding-top:0">${s.l}</div>
      ${kvHtml}${pickHtml}</div>`;
  }).join('');
}

function initStorePicker(){
  const root=document.getElementById('storePicker'); if(!root) return;
  const companySel=document.getElementById('zoneCompany');
  const avail=root.querySelector('.spk-available'), sel=root.querySelector('.spk-selected');
  const search=root.querySelector('.spk-search');
  const itemHTML=s=>`<div class="spk-item" data-code="${s.code}"><span class="spk-code">${s.code}</span><span>${s.name}</span></div>`;
  function refresh(){
    // drop any stale empty-state placeholders before recomputing
    root.querySelectorAll('.spk-empty').forEach(n=>n.remove());
    // available count = only visible (search-filtered) rows
    const q=(search.value||'').toLowerCase();
    let shown=0;
    avail.querySelectorAll('.spk-item').forEach(it=>{
      const hit=it.textContent.toLowerCase().includes(q);
      it.style.display=hit?'':'none'; if(hit) shown++;
    });
    root.querySelector('.spk-avail').textContent=shown;
    root.querySelector('.spk-sel').textContent=sel.querySelectorAll('.spk-item').length;
    if(!avail.querySelector('.spk-item')) avail.innerHTML='<div class="spk-empty">No stores for this company</div>';
    if(!sel.querySelector('.spk-item')) sel.innerHTML='<div class="spk-empty">No stores selected yet</div>';
  }
  function build(){
    const ci=companySel?Math.max(0,BUYERS.indexOf(companySel.value)):0;
    avail.innerHTML=STORES.filter(s=>s.co===ci).map(itemHTML).join('');
    sel.innerHTML=''; search.value=''; refresh();
  }
  function move(from,to){
    from.querySelectorAll('.spk-item.sel').forEach(it=>{it.classList.remove('sel');to.appendChild(it);});
  }
  root.addEventListener('click',e=>{
    const it=e.target.closest('.spk-item'); if(it){it.classList.toggle('sel'); return;}
    if(e.target.closest('.spk-add')){ move(avail,sel); refresh(); }
    else if(e.target.closest('.spk-rem')){ move(sel,avail); refresh(); }
  });
  search.addEventListener('input',refresh);
  if(companySel) companySel.addEventListener('change',build);
  build();
}
function initPcaType(root){
  const sel=root.querySelector('#pcaType'); if(!sel) return;
  const fgByLabel=t=>[...root.querySelectorAll('.fg')].find(g=>{const l=g.querySelector('label');return l&&l.textContent.trim().startsWith(t);});
  const promoFg=fgByLabel('Promo End Date');
  const effFg=fgByLabel('Effective Date')||fgByLabel('Start Date');
  function apply(){
    const isPromo=sel.value.trim().toLowerCase().startsWith('promo');
    // Promo End Date — show only for Promo, and make it required there
    if(promoFg){
      promoFg.style.display=isPromo?'':'none';
      const pl=promoFg.querySelector('label'), req=pl.querySelector('.req');
      if(isPromo&&!req) pl.insertAdjacentHTML('beforeend',' <span class="req">*</span>');
      else if(!isPromo&&req) req.remove();
    }
    // Refinement A — Effective Date ↔ Start Date depending on PCA Type
    if(effFg){
      const el=effFg.querySelector('label'), hasReq=!!el.querySelector('.req');
      el.childNodes[0].nodeValue=(isPromo?'Start Date':'Effective Date')+(hasReq?' ':'');
    }
  }
  sel.onchange=apply; apply();
}
function initPriceScope(root){
  const level=root.querySelector('#priceLevel'), scope=root.querySelector('#priceScope'), company=root.querySelector('#priceCompany');
  if(!level||!scope) return;
  function build(){
    const ci=company?Math.max(0,BUYERS.indexOf(company.value)):0;
    const lv=level.value; let opts;
    if(lv.startsWith('Company')) opts=['All Stores'];
    else if(lv==='Price Zone') opts=PRICEZONES.filter(z=>z.co===ci).map(z=>`${z.code} · ${z.name}`);
    else opts=STORES.filter(s=>s.co===ci).map(s=>`${s.code} · ${s.name}`);
    scope.innerHTML=(opts.length?opts:['— none for this company —']).map(o=>`<option>${o}</option>`).join('');
    scope.disabled=lv.startsWith('Company');
  }
  level.addEventListener('change',build);
  if(company) company.addEventListener('change',build);
  build();
}

function initAssortScope(root){
  const level=root.querySelector('#apLevel'), scope=root.querySelector('#apScope'), company=root.querySelector('#apCompany');
  if(!level||!scope) return;
  function build(){
    const ci=company?Math.max(0,BUYERS.indexOf(company.value)):0;
    const lv=level.value; let opts;
    if(lv.startsWith('Company')) opts=['All Stores (company default)'];
    else if(lv==='Assortment Cluster') opts=CLUSTERS.filter(z=>z.co===ci).map(z=>`${z.code} · ${z.name}`);
    else opts=STORES.filter(s=>s.co===ci).map(s=>`${s.code} · ${s.name}`);
    scope.innerHTML=(opts.length?opts:['— none for this company —']).map(o=>`<option>${o}</option>`).join('');
    scope.disabled=lv.startsWith('Company');
  }
  level.addEventListener('change',build);
  if(company) company.addEventListener('change',build);
  build();
}

function openCreate(key){
  if(key==='price'){ openPriceWizard(); return; }
  if(key==='cost'){ openCostWizard(); return; }
  if(key==='assort'){ openAssortWizard(); return; }
  const cfg=CREATE[key]; if(!cfg) return;
  window.__ret=cfg.list;
  const m=document.getElementById('main');
  m.innerHTML=createForm(cfg); m.scrollTop=0;
  renderSidebar(cfg.list);
  bindTabs();
  bindAttrEditor();
  m.querySelectorAll('[data-back],[data-save]').forEach(b=>b.onclick=()=>route(window.__ret||'home'));
  if(m.querySelector('#storePicker')) initStorePicker();
  if(m.querySelector('#pcaType')) initPcaType(m);
  if(m.querySelector('#priceScope')) initPriceScope(m);
}
function bindCreate(){
  document.querySelectorAll('#main .btn').forEach(b=>{const k=b.textContent.trim();if(CREATE_BTN[k])b.onclick=()=>openCreate(CREATE_BTN[k]);});
}

function bindUM(){
  document.querySelectorAll('#main .btn').forEach(b=>{if(b.textContent.trim()==='New Role')b.onclick=()=>openRoleEditor(null);});
  document.querySelectorAll('#main .row-link').forEach(el=>{const t=el.textContent.trim();if(ROLES.some(r=>r.n===t)){el.style.cursor='pointer';el.onclick=()=>openRoleEditor(t);}});
}

function route(id){
  const page = PAGES[id] || (()=>`<div class="empty">Module not found.</div>`);
  document.getElementById('main').innerHTML = page();
  document.getElementById('main').scrollTop = 0;
  renderSidebar(id);
  bindTabs();
  bindCreate();
  bindBatch();
  bindUM();
  bindBranchAccess();
  const _m=document.getElementById('main');
  if(_m.querySelector('#pcaType')) initPcaType(_m);
  if(_m.querySelector('#priceScope')) initPriceScope(_m);
  if(_m.querySelector('#costScope')) initCostScope(_m);
  document.querySelectorAll('#main [data-dup]').forEach(b=>b.onclick=()=>openPriceWizard(priceSeed(b.dataset.dup)));
  document.querySelectorAll('#main [data-costdup]').forEach(b=>b.onclick=()=>openCostWizard(costSeed(b.dataset.costdup)));
  document.querySelectorAll('#main [data-assortdup]').forEach(b=>b.onclick=()=>openAssortWizard(assortSeed(b.dataset.assortdup)));
  document.querySelectorAll('#main [data-route]').forEach(el=>el.onclick=()=>route(el.dataset.route));
  document.querySelectorAll('#main [data-view]').forEach(el=>{el.style.cursor='pointer';el.onclick=()=>{const s=el.dataset.view,i=s.indexOf(':');openView(s.slice(0,i),s.slice(i+1));};});
}
function bindTabs(){
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick=()=>{
      const target = t.dataset.tab;
      const group = t.parentElement;
      group.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      const prefix = target.split('-').slice(0,-1).join('-');
      document.querySelectorAll('.tabpane').forEach(p=>{
        if(p.id.startsWith(prefix+'-')) p.classList.toggle('active', p.id===target);
      });
    };
  });
}
route('home');
